<title>Página no encontrada · RIUDICC Comunidad</title>
<script>
/* En GitHub Pages de un proyecto (usuario.github.io/repositorio/) el sitio vive en la primera carpeta. */
(function(){
  var base = "/";
  if (/\.github\.io$/.test(location.hostname)) { var p = location.pathname.split("/")[1]; if (p) base = "/" + p + "/"; }
  location.replace(base + "#noencontrada");
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px">
